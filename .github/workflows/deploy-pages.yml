name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个 Pages 部署在跑；新推送排队而不是取消当前部署，
# 避免部署到一半的版本被替换掉。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read   # actions/checkout 读取仓库源码与 lock 文件
  pages: write     # 向 GitHub Pages API 创建 / 更新部署
  id-token: write  # 申请 OIDC token，让 GitHub 校验部署者身份（无需 PAT）

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
